<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>For You 🤍</title>

        <div class="cakes">
            <span>🎂</span>
            <span>🧁</span>
            <span>🍰</span>
        </div>
        <div class="candles">
            <span>🕯️</span>
            <span>🕯️</span>
            <span>🕯️</span>
        </div>
        <style>
            
body{
  margin:0;
  font-family:'Segoe UI',sans-serif;
  background:linear-gradient(
  180deg,
  #2b1055,
  #7597de,
  #fbc2eb
);
animation:bgMove 12s ease-in-out infinite alternate;
  color:#fff;
  text-align:center;
}

.container{padding:25px;}

h1{font-size:2rem;}
.subtitle{opacity:.8;margin-bottom:20px;}

.card{
  background:rgba(255,255,255,.12);
  padding:25px;
  border-radius:20px;
  box-shadow:0 10px 30px rgba(0,0,0,.3);
}

/* 📸 Photos */
#photos{
  display:none;
  margin-bottom:25px;
}

#photos h3{
  font-weight:300;
  margin-bottom:15px;
  opacity:.9;
}

.gallery img{
  width:100%;
  max-width:260px;
  margin:0 auto;
  padding:10px;
  background:#fff;
  border-radius:12px;
  box-shadow:0 8px 20px rgba(0,0,0,.25);
  display:none;
}
.gallery img.active{
  display:block;
}

#letter{
  display:none;
  max-width:260px;        /* 📸 photos jaisi width */
  margin:0 auto;         /* ✅ center align */
  text-align:left;       /* 👈 text readable rahe */
  font-size:1rem;
  line-height:1.7;
  white-space:pre-line;
  background:rgba(255,255,255,.12);
  padding:20px;
  border-radius:15px;
  box-shadow:0 8px 20px rgba(0,0,0,.25);
}

/* Button */
button{
  width:100%;
  margin-top:25px;
  padding:14px;
  border:none;
  border-radius:30px;
  background:#fff;
  color:#2c5364;
  font-size:1rem;
}

/* 🤍 Hearts */
.heart{
  position:fixed;
  font-size:18px;
  animation:float 2s ease forwards;
  pointer-events:none;
}
@keyframes float{
  to{transform:translateY(-100px);opacity:0;}
}

/* 🖤 Last Screen */
#final{
  position:fixed;
  inset:0;
  background:#000;
  display:flex;
  align-items:center;
  justify-content:center;
  flex-direction:column;
  opacity:0;
  pointer-events:none;
  transition:opacity 2.5s ease;
  z-index: 9999;
}

#final.show{
  opacity:1;
  pointer-events:auto;
}

#final h2{
  font-size:2rem;
  font-weight:300;
  animation:fadeText 4s ease infinite;
}

@keyframes fadeText{
  0%{opacity:.3;}
  50%{opacity:1;}
  100%{opacity:.3;}
}
@keyframes bgMove{
  from{background-position:0% 0%;}
  to{background-position:0% 100%;}
}
.cakes span{
  position:fixed;
  bottom:-50px;
  font-size:30px;
  animation:floatCake 10s linear infinite;
  opacity:0.6;
}

.cakes span:nth-child(1){left:15%;animation-delay:0s;}
.cakes span:nth-child(2){left:50%;animation-delay:3s;}
.cakes span:nth-child(3){left:80%;animation-delay:6s;}

@keyframes floatCake{
  from{transform:translateY(0);}
  to{transform:translateY(-120vh);}
}
.candles span{
  position:fixed;
  bottom:-40px;
  font-size:24px;
  animation:floatCandle 14s ease-in infinite;
  opacity:0.4;
}

.candles span:nth-child(1){left:25%;animation-delay:2s;}
.candles span:nth-child(2){left:60%;animation-delay:5s;}
.candles span:nth-child(3){left:75%;animation-delay:8s;}

@keyframes floatCandle{
  from{transform:translateY(0) scale(1);}
  to{transform:translateY(-130vh) scale(1.2);}
}
/* 🖤 Intro Screen */
#intro{
  position:fixed;
  inset:0;
  background:#000;
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  z-index:999;
  transition:opacity 2s ease;
}

#intro.hide{
  opacity:0;
  pointer-events:none;
}

#intro h2{
  font-size:2rem;
  font-weight:300;
  margin-bottom:10px;
  animation:fadeText 4s ease infinite;
}

#intro p{
  font-size:.8rem;
  opacity:.6;
}
.container{
  opacity:0;
  transition:opacity 2s ease;
}

.container.show{
  opacity:1;
}
/* ✨ Tap to Next Glow Animation */
.glow-btn{
  position:relative;
  overflow:hidden;
  animation:glowPulse 3s ease-in-out infinite;
}

@keyframes glowPulse{
  0%{
    box-shadow:0 0 0 rgba(255,255,255,0.4);
    transform:scale(1);
  }
  50%{
    box-shadow:
      0 0 15px rgba(255,255,255,0.6),
      0 0 30px rgba(255,255,255,0.4);
    transform:scale(1.04);
  }
  100%{
    box-shadow:0 0 0 rgba(255,255,255,0.4);
    transform:scale(1);
  }
}   

#videoSection{
  margin:25px auto;
}

#videoSection video{
  width:100%;
  max-width:320px;
  border-radius:16px;
  box-shadow:
    0 0 30px rgba(255,180,120,.35);
}
</style>
    </head>

    <body>
        <!-- 🖤 INTRO SCREEN -->
        <div id="intro">
            <h2>I’m glad you were born.🤗</h2>
            <p>Tap anywhere to continue</p>
        </div>
        <audio id="bgm" loop>
            <source src="Until_I_Found_You.mp3" type="audio/mpeg">
        </audio>

        <div class="container">
            <h1>🎂 Happy Birthday 🤍</h1>
            <p style="opacity:.8;font-size:.9rem;">
                A little celebration… for the day you were born 🥳🤍
            </p>
            <div class="subtitle">Please take your time…</div>

            <div class="card">

                <!-- 📸 PHOTOS FIRST -->
                <div id="photos">
                    <h3>Some moments I hold close 🤍</h3>
                    <div class="gallery">
                        <img src="img11.jpeg" class="active">
                        <img src="img2.jpeg">
                        <img src="img3.jpeg">
                        <img src="img4.jpeg">
                        <img src="img5.jpeg">
                        <img src="img6.jpeg">
                        <img src="img7.jpeg">
                        <img src="img8.jpeg">
                    </div>
                </div>

                <!-- ✅ UPDATED BUTTON -->
                <button id="nextBtn" class="glow-btn" onclick="nextStep()">Tap
                    to Next →</button>

            </div>
        </div>

        <!-- 🖤 LAST SCREEN -->
        <div id="final">
            <h2>Thank you for existing.😭🙏</h2>
        </div>

        <div id="videoSection" style="display:none;">
            <video id="memoryVideo" controls playsinline>
                <source src="video1.mp4" type="video/mp4">
            </video>

            <button id="videoNextBtn" onclick="showLetter()"
                style="display:none;">
                Tap to Next →
            </button>

            <!-- ✅ LETTER NOW UNDER VIDEO -->
            <div id="letter"></div>
        </div>

        <script>
const letterText = `
Dear Love (TANVI)

Kuch yaadein hoti hain
jo shor nahi karti,
bas chup-chaap saath baith jaati hain.😞

Jab main in lamhon ko dekhta hoon,
mujhe samajh aata hai
ki main kitna lucky hoon.😊🌸

Tumhari presence meri zindagi
ko heavy nahi,
behtar banaati hai.😌🤭

Aur agar kabhi tumhe lage
ki tum akeli ho,
toh yaad rakhna —
main yahin hoon.🤗🧿

I hope I make you feel as loved
as you make me feel.❤💖

— DHRUV (PILLU)🤍🌸
`;

let stage = 0;
let i = 0;

const photosDiv = document.getElementById("photos");
const letterDiv = document.getElementById("letter");
const btn = document.getElementById("nextBtn");

/* 📸 Gallery */
let index = 0;
const imgs = document.querySelectorAll(".gallery img");
function startGallery(){
  setInterval(()=>{
    imgs[index].classList.remove("active");
    index = (index + 1) % imgs.length;
    imgs[index].classList.add("active");
  },2500);
}

/* 👉 Button Control */
function nextStep(){
  if(stage === 0){
    document.getElementById("bgm").play();
    photosDiv.style.display = "block";
    startGallery();
    stage = 1;
  }
  else if(stage === 1){
    document.getElementById("videoSection").style.display = "block";
    document.getElementById("videoNextBtn").style.display = "block";
    btn.style.display = "none"; // main button hide
    stage = 2;
  }

else if(stage === 2){
  btn.style.display = "none";
  letterDiv.style.display = "block";
  typeLetter();
  stage = 3;
}
}

/* ✍️ Typewriter */
function typeLetter(){
  if(i < letterText.length){
    letterDiv.innerHTML += letterText.charAt(i);
    i++;
    setTimeout(typeLetter,45);
  } else {
    setTimeout(showFinal,3500);
  }
}

/* 🖤 Final Screen */
function showFinal(){
  document.getElementById("final").classList.add("show");

  // ❌ video hide
  document.getElementById("videoSection").style.display = "none";

  fadeOutMusic();
}

/* 🤍 Soft hearts */
document.addEventListener("click",e=>{
  const h = document.createElement("div");
  h.className = "heart";
  h.innerHTML = "🤍";
  h.style.left = e.clientX + "px";
  h.style.top = e.clientY + "px";
  document.body.appendChild(h);
  setTimeout(()=>h.remove(),2000);
});
const intro = document.getElementById("intro");
const main = document.querySelector(".container");

intro.addEventListener("click", ()=>{
  const bgm = document.getElementById("bgm");
  bgm.volume = 0.4;
  bgm.play();

  intro.classList.add("hide");
  main.classList.add("show");
});
function fadeOutMusic(){
  const bgm = document.getElementById("bgm");
  let vol = bgm.volume;

  const fade = setInterval(()=>{
    if(vol > 0.02){
      vol -= 0.02;
      bgm.volume = vol;
    } else {
      bgm.volume = 0;
      bgm.pause();
      clearInterval(fade);
    }
  }, 200); // smooth & slow
}

const video = document.getElementById("memoryVideo");
const bgm = document.getElementById("bgm");

video.addEventListener("play",()=>{
  bgm.volume = 0.15;
});
video.addEventListener("pause",()=>{
  bgm.volume = 0.4;
});
function showLetter(){
  document.getElementById("videoNextBtn").style.display = "none";
  letterDiv.style.display = "block";
  typeLetter();
}
</script>

    </body>

</html>
